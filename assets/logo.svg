<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glass circle -->
  <circle cx="48" cy="48" r="46" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.5"/>
  <!-- Inner glow ring -->
  <circle cx="48" cy="48" r="46" fill="url(#innerGlow)" opacity="0.4"/>
  <!-- Specular highlight -->
  <ellipse cx="38" cy="28" rx="14" ry="6" fill="white" opacity="0.25" transform="rotate(-20 38 28)"/>

  <!-- Hat brim -->
  <rect x="24" y="42" width="34" height="6" rx="3" fill="white" opacity="0.95"/>
  <!-- Hat crown -->
  <rect x="30" y="22" width="22" height="22" rx="4" fill="white" opacity="0.95"/>
  <!-- Hat band -->
  <rect x="30" y="38" width="22" height="4" rx="1" fill="url(#bandGrad)"/>

  <!-- Head -->
  <ellipse cx="41" cy="58" rx="10" ry="9" fill="#FDDCB0" opacity="0.95"/>

  <!-- Body / coat -->
  <path d="M26 82 Q26 68 41 67 Q56 68 56 82 Z" fill="white" opacity="0.85"/>

  <!-- Magnifying glass handle -->
  <line x1="56" y1="66" x2="72" y2="82" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- Magnifying glass circle -->
  <circle cx="52" cy="61" r="11" stroke="url(#lensGrad)" stroke-width="3" fill="url(#lensFill)"/>
  <!-- Lens glint -->
  <circle cx="47" cy="56" r="2.5" fill="white" opacity="0.6"/>

  <defs>
    <radialGradient id="glassFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a4080" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020a18" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00aaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <radialGradient id="lensFill" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0030aa" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
</svg>
